<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موارد الدولية — لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-card__logo">🏢</div>
            <h1 class="login-card__title">موارد الدولية</h1>
            <p class="login-card__subtitle">لوحة التحكم — تسجيل الدخول</p>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">اسم المستخدم</label>
                    <input type="text" id="username" placeholder="admin" required>
                </div>
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" placeholder="••••" required>
                </div>
                <button type="submit" class="btn btn--primary btn--full">دخول</button>
                <p id="login-error" class="login-error" style="display:none;">اسم المستخدم أو كلمة المرور غير صحيحة</p>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
