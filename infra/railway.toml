# Railway service config for the Mawared backend.
# Two services share this codebase:
#   - api:    HTTP listener (main.ts)
#   - worker: BullMQ consumer (worker.ts)
# Each service overrides startCommand via the Railway dashboard.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/backend/Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Pre-deploy: apply pending migrations from a one-off container before the
# new app version replaces the old. Keep this OUT of main.ts so multi-replica
# rollouts don't race.
#
# Uses the globally-installed `prisma` CLI baked into the runtime stage of
# apps/backend/Dockerfile (pnpm is not present at runtime). WORKDIR is
# /repo/apps/backend, so the relative schema path resolves correctly.
preDeployCommand = "prisma migrate deploy --schema=prisma/schema.prisma"
